<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login · Getnet Agent Swarm</title><style>
:root{color-scheme:dark;--red:#ef0000;--bg:#140404;--panel:#290b0b;--line:#632222;--muted:#c9aaaa}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top,#650909,var(--bg) 48%);font:15px Inter,Segoe UI,sans-serif;color:white}.box{width:min(430px,calc(100% - 32px));padding:34px;background:#240909;border:1px solid var(--line);border-radius:24px;box-shadow:0 25px 80px #000a}.brand{display:flex;align-items:center;gap:12px;margin-bottom:28px}.logo{display:grid;place-items:center;width:46px;height:46px;border-radius:10px;background:var(--red);font-weight:900}h1{margin:0;font-size:23px}p{color:var(--muted);line-height:1.5}label{display:block;margin:16px 0 7px;font-weight:700}input{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:#190707;color:#fff;font-size:15px}button{width:100%;margin-top:20px;padding:14px;border:0;border-radius:12px;background:var(--red);color:#fff;font-weight:800;cursor:pointer}.demo{margin-top:22px;padding:14px;border:1px dashed var(--line);border-radius:12px;font-size:13px;color:var(--muted)}#error{color:#ff8e8e;min-height:20px}</style></head><body><main class="box"><div class="brand"><div class="logo">G</div><div><h1>Acesso operacional</h1><p style="margin:3px 0 0">Getnet Agent Swarm</p></div></div><form id="form"><label for="user">Usuário</label><input id="user" autocomplete="username" required><label for="password">Senha</label><input id="password" type="password" autocomplete="current-password" required><button>Entrar</button><p id="error"></p></form><div class="demo"><b>Acesso de demonstração</b><br>Gestão: admin / getnet-demo-admin<br>Especialista: especialista / getnet-demo-specialist</div></main><script>
const form=document.querySelector('#form'),error=document.querySelector('#error');form.onsubmit=async e=>{e.preventDefault();error.textContent='';const response=await fetch('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:user.value,password:password.value})});if(!response.ok){error.textContent='Usuário ou senha inválidos.';return}const data=await response.json();const requested=new URLSearchParams(location.search).get('next');location.href=requested||(data.role==='admin'?'/gestao':'/especialista')};
</script></body></html>
